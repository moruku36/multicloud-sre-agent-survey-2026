[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "multicloud-sre-local"
version = "0.1.0"
description = "Offline, evidence-grounded multi-cloud SRE prototype"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sre-demo = "sre_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sre_agent = ["fixtures/*.json"]
